services:

  wp-database:  
    image: mariadb:10.6.4-focal
    container_name: '${CONTAINER_BASENAME}-db'
    restart: unless-stopped
    #typically 3306:3306 but running different port just in case of local port conflict issues
    #ports: 
    #  - 3307:3306
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD}'
      MYSQL_DATABASE: '${MYSQL_DATABASE}'
      MYSQL_USER: '${MYSQL_USER}'
      MYSQL_PASSWORD: '${MYSQL_PASSWORD}'
    volumes:
      - db-data:/var/lib/mysql
    networks:
      wordpress-network:
        ipv4_address: '${DATABASE_IP}'
          

  phpmyadmin:
    depends_on:
      - wp-database
    image: phpmyadmin/phpmyadmin
    container_name: '${CONTAINER_BASENAME}-phpmyadmin'
    restart: unless-stopped
    ports:
      - 8081:80
    env_file: .env
    environment:
      PMA_HOST: wp-database
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD}'
    networks:
      wordpress-network:
        ipv4_address: '${PMA_IP}'

  wordpress:
    depends_on:
      - wp-database
    build: ./
    container_name: '${CONTAINER_BASENAME}-wordpress'
    restart: unless-stopped
    ports:
      - 8080:80
    env_file: .env
    environment:
      WORDPRESS_DB_HOST: wp-database:3306
      WORDPRESS_DB_NAME: '${MYSQL_DATABASE}' 
      WORDPRESS_DB_USER: '${MYSQL_USER}'
      WORDPRESS_DB_PASSWORD: '${MYSQL_PASSWORD}'
    volumes:
      - wp-data:/var/www/html
      - ./wp-content:/var/www/html/wp-content/:rw
      - /var/www/html/wp-content/themes/base/vendor
      - /var/www/html/wp-content/themes/base/node_modules
    networks:
      wordpress-network:
        ipv4_address: '${WP_IP}'


  codecept:
    depends_on:
      - wordpress
      - chrome
    image: codeception/codeception:5.1.2
    container_name: '${CONTAINER_BASENAME}-codeception'
    volumes:
      - test-data:/project
      - .:/project/:rw
    networks:
      wordpress-network:
        ipv4_address: 172.28.0.5
    
    

  chrome:
    image: selenium/standalone-chrome:127.0-chromedriver-127.0
    container_name: '${CONTAINER_BASENAME}-selenium'
    restart: unless-stopped
    ports:
      - "7900:7900"
      - "4444:4444"
    env_file: .env
    shm_size: 2g
    networks:
      wordpress-network:
        ipv4_address: '${CHROME_IP}'

volumes:
  db-data:
  test-data:
  wp-data:

networks:
  wordpress-network:
    driver: bridge
    ipam:
      config:
        - subnet: '${NETWORK_SUBNET}'